# The gateway hop of the server deployment chain:
#   system nginx (TLS, bot.domain) -> this container -> web -> app.
# Everything funnels into the web container: it serves the SPA and already
# proxies /api (player websocket included) to the app container.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Local-library uploads ride through this hop (up to MAX_UPLOAD_MB).
    client_max_body_size 64m;

    # Docker's embedded DNS; re-resolve web per request — its IP changes
    # on every rebuild, and nginx otherwise caches the first answer.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The player state websocket is long-lived.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
