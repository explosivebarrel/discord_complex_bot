services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: dcbot-lavalink
    restart: unless-stopped
    # The supervisor gates the youtube plugin on a reachability probe and
    # restarts Lavalink only when the verdict flips (see supervise.sh).
    entrypoint: ["/bin/sh", "/opt/Lavalink/supervise.sh"]
    environment:
      _JAVA_OPTIONS: "-Xmx256M"
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in .env}
      # Google OAuth for the youtube-source plugin; empty on first start
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YANDEX_MUSIC_TOKEN: ${YANDEX_MUSIC_TOKEN:-}
      YANDEX_MUSIC_ENABLED: ${YANDEX_MUSIC_ENABLED:-false}
    volumes:
      # The supervisor renders application.yml from this template with the
      # youtube-plugin verdict baked in (see lavalink/supervise.sh).
      - ./lavalink/application.yml:/opt/Lavalink/application.yml.template:ro
      - ./lavalink/supervise.sh:/opt/Lavalink/supervise.sh:ro
    # No published port: the app reaches it over the compose network
    # (LAVALINK_HOST=lavalink). Debug access goes through
    # docker-compose.override.yml.

  app:
    build: .
    container_name: dcbot-app
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file: .env
    environment:
      # In docker-compose the bot uses the lavalink service name.
      LAVALINK_HOST: lavalink
      # Keep the SQLite file on the named volume. Do not put it inside the container.
      DATABASE_URL: sqlite+aiosqlite:////data/bot.db
      # Lavalink fetches local library files from the app service.
      INTERNAL_BASE_URL: http://app:8000
      MUSIC_LIBRARY_DIR: /data/music
      # The logged-in browser that hands out VK stream URLs (see vkresolver/).
      VK_RESOLVER_URL: http://vk-resolver:8100
    volumes:
      # The DB lives on the server disk at data/bot.db (plain bind): visible
      # on the host, backed up with the usual disk backup. On the local
      # Windows machine docker-compose.override.yml swaps this back to the
      # named volume — SQLite over a Windows bind mount is a locking/perf
      # hazard, so dev keeps the volume.
      - ./data:/data
      # The panel edits the Yandex token here; lavalink reads it on recreate.
      - ./.env:/srv/.env
    # No published port: the web container is the front door (see below).

  web:
    # Rebuild WITHOUT touching the bot's voice: the bare `up` reconciles
    # dependencies and recreates dcbot-app whenever its config hash changed
    # (the panel writes tokens into .env) — that drops voice channels.
    # Frontend deploys must be:
    #   docker compose up -d --no-deps --build web
    build: ./web
    container_name: dcbot-web
    restart: unless-stopped
    depends_on:
      - app
    # Frontend-only changes rebuild just this image; the bot stays up.
    # No published port: the gateway container is the front door.

  vk-resolver:
    build: ./vkresolver
    container_name: dcbot-vk-resolver
    restart: unless-stopped
    environment:
      PROFILE_DIR: /profile
      # Exported on the admin's machine by tools/vk_spike/export_session.py.
      SESSION_FILE: /session/vk_session.json
    volumes:
      - vk-profile:/profile
      # Whole data dir read-only: single-file bind mounts confuse Docker
      # Desktop when the file appears after the first mount.
      - ./data:/session:ro
    # No published port: VK_RESOLVER_URL points at the service name.

  # The single front door on the host: system nginx (TLS via certbot)
  # proxies bot.domain here, and this hop forwards everything to web.
  # Mirrors the memle55 angie-gateway convention: no compose service
  # publishes ports on its own.
  gateway:
    image: nginx:alpine
    container_name: dcbot-gateway
    restart: unless-stopped
    depends_on:
      - web
      - app
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Loopback only: the system nginx reaches it on localhost, the
      # internet never sees this port. The host port is per-server (other
      # services on the box count their own gateway ports from 8101):
      # set GATEWAY_EXPOSED_PORT in .env, the system nginx proxies
      # bot.domain to 127.0.0.1:<that port>.
      - "127.0.0.1:${GATEWAY_EXPOSED_PORT:-8080}:80"

# bot-data is used by the local dev override only (the server bind-mounts
# ./data:/data); the declaration stays so the override stays valid.
volumes:
  bot-data:
  vk-profile:
