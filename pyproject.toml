[project]
name = "discord-complex-bot"
version = "0.1.0"
description = "Multi-purpose Discord bot: music (Lavalink), server management, web panel"
requires-python = ">=3.10"
dependencies = [
    "discord.py[voice]>=2.4",
    "wavelink>=3.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["UP007"]  # keep Optional[X] style for py3.10 runtime safety

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
