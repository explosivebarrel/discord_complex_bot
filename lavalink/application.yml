server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases" 
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      # The built-in source is broken against YouTube. The plugin above replaces it.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      rotation: true
      distortion: true
      channelMix: true
      lowPass: true
    nonAllocatingFrameBuffer: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 0
    resamplingQuality: "HIGH"
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 6
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    oauth:
      # YouTube rejects anonymous stream access. OAuth signs the playback
      # requests with a Google account. The first start prints a login URL and
      # a device code into the logs; the refresh token is printed after login.
      # Paste the token into YOUTUBE_REFRESH_TOKEN (.env) to skip the flow.
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    clients:
      - MUSIC
      - ANDROID_VR
      - TV
      - IOS
      - WEB

  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      # Flipped on by YANDEX_MUSIC_ENABLED=true in .env once a token is set.
      # LavaSrc refuses to start with the source enabled but an empty token.
      yandexmusic: ${YANDEX_MUSIC_ENABLED:false}
    yandexmusic:
      # Personal OAuth token of a Yandex Music account (Plus recommended).
      # See the panel settings page for how to obtain it.
      accessToken: "${YANDEX_MUSIC_TOKEN:}"
      playlistLoadLimit: 1
      albumLoadLimit: 1
      artistLoadLimit: 1

logging:
  file:
    path: ./logs/
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
  level:
    root: INFO
    lavalink: INFO
    # Print the OAuth login URL and the resulting refresh token.
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
    # Yandex Music search is flaky; DEBUG shows the real HTTP cause.
    com.github.topi314.lavasrc: DEBUG
